[project]
name = "repo-retriever"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.0",
    "tree-sitter>=0.25",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "codemap*",
    "indexer*",
    "models*",
    "retriever*",
    "storage*",
]
exclude = ["tests*"]
services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: repo_retriever
      POSTGRES_USER: retriever
      POSTGRES_PASSWORD: retriever
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
